<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OldBlox Revival</title>
    <link rel="icon" href="https://herseybuoyunda.github.io/hbocdn.github.io/Favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://herseybuoyunda.github.io/hbocdn.github.io/SiteArkaPlaniKaranlikTema.png');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; }
        p { color: #cccccc; margin-bottom: 30px; }
        .downloads {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OldBlox Revival</h1>
        <p>Platformunuzu seçin ve oynamaya başlayın!</p>
        <div class="downloads">
            <a href="#" class="btn">Windows İndir</a>
            <a href="#" class="btn">Linux İndir</a>
            <a href="#" class="btn">Android İndir</a>
        </div>
    </div>
</body>
</html>
