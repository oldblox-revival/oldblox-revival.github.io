<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OldBlox Revival</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://oldblox-revival.github.io/favicon.ico" type="image/x-icon">
    
    <!-- Google reCAPTCHA Script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://herseybuoyunda.github.io/hbocdn.github.io/SiteArkaPlaniKaranlikTema.png');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 650px;
            width: 90%;
            margin: 20px 0;
        }
        .logo {
            max-width: 180px;
            margin-bottom: 15px;
        }
        h1 { margin-bottom: 5px; font-size: 24px; }
        p { color: #cccccc; margin-bottom: 20px; font-size: 14px; }
        
        /* reCAPTCHA Hizalama */
        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .downloads {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.3s;
            text-align: center;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://oldblox-revival.github.io/OBXRLogoB.png" alt="OBXR Logo" class="logo">
        <h1>OldBlox Revival</h1>
        <p>Oynamak istediğiniz platformu seçin:</p>
        
        <!-- Google reCAPTCHA v2 -->
        <div class="recaptcha-wrapper">
            <div class="g-recaptcha" data-sitekey="6LdeKuQtAAAAAPQsQVWsTzZKvm5OzPsZ-8MRZFKH"></div>
        </div>

        <div class="downloads">
            <a href="OBXRWindows/" class="btn">Windows</a>
            <a href="OBXRLinux/" class="btn">Linux</a>
            <a href="OBXRMacOS/" class="btn">MacOS</a>
            <a href="OBXRChromeOS/" class="btn">ChromeOS</a>
            <a href="OBXRAndroid/" class="btn">Android</a>
            <a href="OBXRIOS/" class="btn">iOS</a>
            <a href="OBXRPlayStaysion/" class="btn">PlayStation</a>
            <a href="OBXRXbox/" class="btn">Xbox</a>
            <a href="OBXRIPadOS/" class="btn">iPadOS</a>
        </div>
    </div>
</body>
</html>
